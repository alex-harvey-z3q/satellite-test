---
- name: Deploy the Proxmox Foreman answer adapter
  hosts: all
  become: true
  gather_facts: false
  vars:
    proxmox_answer_handler_path: /usr/local/libexec/proxmox-foreman-answer.py
    proxmox_answer_service_name: proxmox-foreman-answer
    proxmox_answer_socket: /run/proxmox-foreman-answer/answer.sock
    proxmox_answer_endpoint: /proxmox-answer

  pre_tasks:
    - name: Verify the local answer-adapter sources
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      loop:
        - "{{ playbook_dir }}/../../proxmox/files/usr/local/libexec/proxmox-foreman-answer.py"
        - "{{ playbook_dir }}/../../proxmox/files/etc/systemd/system/proxmox-foreman-answer.service"
      register: proxmox_answer_sources

    - name: Require the local answer-adapter sources
      ansible.builtin.assert:
        that: item.stat.isreg | default(false)
        fail_msg: "Missing answer-adapter source {{ item.item }}."
      loop: "{{ proxmox_answer_sources.results }}"

  tasks:
    - name: Install the answer-adapter handler
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../proxmox/files/usr/local/libexec/proxmox-foreman-answer.py"
        dest: "{{ proxmox_answer_handler_path }}"
        owner: root
        group: root
        mode: '0755'
      notify: Restart answer adapter

    - name: Install the answer-adapter systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../proxmox/files/etc/systemd/system/proxmox-foreman-answer.service"
        dest: "/etc/systemd/system/{{ proxmox_answer_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
      notify: Restart answer adapter

    - name: Enable and start the answer-adapter service
      ansible.builtin.systemd_service:
        name: "{{ proxmox_answer_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending answer-adapter configuration change
      ansible.builtin.meta: flush_handlers

    - name: Verify the answer adapter rejects an identity-free request
      ansible.builtin.uri:
        url: "http://127.0.0.1{{ proxmox_answer_endpoint }}"
        method: POST
        body_format: json
        body:
          network_interfaces: []
        status_code: 400

  handlers:
    - name: Restart answer adapter
      ansible.builtin.service:
        name: "{{ proxmox_answer_service_name }}"
        state: restarted
