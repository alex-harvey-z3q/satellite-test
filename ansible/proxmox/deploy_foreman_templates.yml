---
- name: Deploy Proxmox Foreman templates through local Hammer
  hosts: all
  become: true
  gather_facts: false
  vars:
    proxmox_template_targets:
      - name: Proxmox Autoinstall Answer File
        source: "{{ playbook_dir }}/../../proxmox/erb/answer.toml.erb"
        staged: /var/tmp/proxmox-answer.toml.erb
      - name: Proxmox VE PXEiPXE
        source: "{{ playbook_dir }}/../../proxmox/erb/ipxe.erb"
        staged: /var/tmp/proxmox-ipxe.erb

  pre_tasks:
    - name: Require the Satellite FQDN used by the iPXE template
      ansible.builtin.assert:
        that:
          - proxmox_foreman_fqdn is defined
          - proxmox_foreman_fqdn | length > 0

    - name: Verify the template source files
      ansible.builtin.stat:
        path: "{{ item.source }}"
      delegate_to: localhost
      become: false
      loop: "{{ proxmox_template_targets }}"
      register: proxmox_template_sources

    - name: Require the template source files
      ansible.builtin.assert:
        that: item.stat.isreg | default(false)
        fail_msg: "Missing template source {{ item.item.source }}."
      loop: "{{ proxmox_template_sources.results }}"

  tasks:
    - name: Read the deployed Foreman template bodies
      ansible.builtin.command:
        argv: [hammer, template, dump, --name, "{{ item.name }}"]
      loop: "{{ proxmox_template_targets }}"
      register: proxmox_deployed_templates
      changed_when: false

    - name: Require the Foreman templates created by the prerequisite playbook
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: "Template {{ item.item.name }} is missing; run make proxmox-prerequisites first."
      loop: "{{ proxmox_deployed_templates.results }}"

    - name: Stage changed Proxmox Foreman template bodies
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', item.item.source)
             | replace('REPLACE_WITH_FOREMAN_FQDN', proxmox_foreman_fqdn) }}
        dest: "{{ item.item.staged }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ proxmox_deployed_templates.results }}"
      when: >-
        item.stdout !=
        (lookup('ansible.builtin.file', item.item.source)
         | replace('REPLACE_WITH_FOREMAN_FQDN', proxmox_foreman_fqdn))

    - name: Update changed Foreman template bodies
      ansible.builtin.command:
        argv: [hammer, template, update, --name, "{{ item.item.name }}", --file, "{{ item.item.staged }}"]
      loop: "{{ proxmox_deployed_templates.results }}"
      when: >-
        item.stdout !=
        (lookup('ansible.builtin.file', item.item.source)
         | replace('REPLACE_WITH_FOREMAN_FQDN', proxmox_foreman_fqdn))
      changed_when: true

    - name: Remove staged Proxmox Foreman template bodies
      ansible.builtin.file:
        path: "{{ item.staged }}"
        state: absent
      loop: "{{ proxmox_template_targets }}"
