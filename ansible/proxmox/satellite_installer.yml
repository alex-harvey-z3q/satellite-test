---
- name: Apply the POC-specific Proxmox Satellite customization
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install the POC Puppet module used by Satellite Installer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/foreman-installer/modules/proxmox_answer/"
        dest: /usr/share/foreman-installer/modules/proxmox_answer/
        owner: root
        group: root
        mode: preserve

    - name: Configure the POC custom Hiera classes for Satellite Installer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/foreman-installer/custom-hiera.yaml"
        dest: /etc/foreman-installer/custom-hiera.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Apply the POC custom Hiera configuration through Satellite Installer
      ansible.builtin.command:
        argv: [satellite-installer, --scenario, satellite]
      changed_when: false

    - name: Validate the Apache configuration generated by Satellite Installer
      ansible.builtin.command: httpd -t
      changed_when: false
