---
- name: Create minimal Foreman objects for Proxmox answer-file acceptance tests
  hosts: all
  become: true
  gather_facts: false
  vars:
    proxmox_prerequisites_apply: false
    proxmox_test_organization: "Default Organization"
    proxmox_test_location: "Default Location"
    proxmox_test_subnet_name: "proxmox-acceptance-test"
    proxmox_test_subnet_network: "192.0.2.0"
    proxmox_test_subnet_mask: "255.255.255.0"
    proxmox_test_subnet_gateway: "192.0.2.1"
    proxmox_test_subnet_dns: "192.0.2.53"
    proxmox_test_dhcp_proxy: "localhost"
    proxmox_test_acceptance_ip: "192.0.2.250"
    proxmox_test_domain: "proxmox-acceptance.test"
    proxmox_allow_routable_test_subnet: false
    proxmox_test_os_name: "proxmox-ve"
    proxmox_test_os_major: "9"
    proxmox_test_os_release_name: "acceptance-test"
    proxmox_test_medium_name: "Debian mirror"
    proxmox_test_partition_table_name: "Preseed default"
    proxmox_test_root_password: "Welcome1"
    proxmox_test_hostgroup_name: "Proxmox AWS Acceptance Test"
    proxmox_answer_template_name: "Proxmox Autoinstall Answer File"
    proxmox_ipxe_template_name: "Proxmox VE PXEiPXE"
    proxmox_acceptance_fixture: "{{ playbook_dir }}/../spec/fixtures/foreman-acceptance-host.json"
    proxmox_acceptance_fixture_example: "{{ playbook_dir }}/../spec/fixtures/foreman-acceptance-host.json.example"

  pre_tasks:
    - name: Require explicit approval for test-object creation
      ansible.builtin.assert:
        that:
          - proxmox_prerequisites_apply | bool
          - proxmox_test_subnet_network == '192.0.2.0' or proxmox_allow_routable_test_subnet | bool
        fail_msg: >-
          This playbook creates Foreman records. Run it only through
          `make hammer`; non-TEST-NET CIDRs require explicit approval.

    - name: Verify Hammer is available with local Satellite credentials
      ansible.builtin.command: hammer --output json organization list
      changed_when: false

  tasks:
    - name: Query existing Foreman organizations
      ansible.builtin.command:
        argv: [hammer, --output, json, organization, list, --per-page, '9999']
      register: proxmox_organizations
      changed_when: false

    - name: Select the test organization
      ansible.builtin.set_fact:
        proxmox_organization_matches: >-
          {{ (proxmox_organizations.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_organization) | list }}

    - name: Verify the test organization is unique
      ansible.builtin.assert:
        that: proxmox_organization_matches | length == 1
        fail_msg: "Expected exactly one organization named {{ proxmox_test_organization }}."

    - name: Query existing Foreman locations
      ansible.builtin.command:
        argv: [hammer, --output, json, location, list, --per-page, '9999']
      register: proxmox_locations
      changed_when: false

    - name: Select the test location
      ansible.builtin.set_fact:
        proxmox_location_matches: >-
          {{ (proxmox_locations.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_location) | list }}

    - name: Verify the test location is unique
      ansible.builtin.assert:
        that: proxmox_location_matches | length == 1
        fail_msg: "Expected exactly one location named {{ proxmox_test_location }}."

    - name: Query the x86_64 architecture
      ansible.builtin.command:
        argv: [hammer, --output, json, architecture, list, --per-page, '9999']
      register: proxmox_architectures
      changed_when: false

    - name: Verify x86_64 is available
      ansible.builtin.assert:
        that: >-
          ((proxmox_architectures.stdout | from_json)
          | selectattr('Name', 'equalto', 'x86_64') | list | length) == 1
        fail_msg: Satellite must provide the x86_64 architecture.

    - name: Record the x86_64 architecture ID
      ansible.builtin.set_fact:
        proxmox_test_architecture_id: >-
          {{ ((proxmox_architectures.stdout | from_json)
             | selectattr('Name', 'equalto', 'x86_64') | list | first).Id }}

    - name: Query Smart Proxies
      ansible.builtin.command:
        argv: [hammer, --output, json, proxy, list, --per-page, '9999']
      register: proxmox_smart_proxies
      changed_when: false

    - name: Select the DHCP Smart Proxy managed by Satellite Installer
      ansible.builtin.set_fact:
        proxmox_dhcp_proxy_matches: >-
          {{ (proxmox_smart_proxies.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_dhcp_proxy) | list }}

    - name: Verify the DHCP Smart Proxy is unique
      ansible.builtin.assert:
        that: proxmox_dhcp_proxy_matches | length == 1
        fail_msg: >-
          Expected exactly one Smart Proxy named {{ proxmox_test_dhcp_proxy }}.
          Run make satellite-installer first so Satellite Installer configures its local proxy.

    - name: Query existing Proxmox test domain
      ansible.builtin.command:
        argv: [hammer, --output, json, domain, list, --per-page, '9999']
      register: proxmox_domains
      changed_when: false

    - name: Select the Proxmox test domain
      ansible.builtin.set_fact:
        proxmox_domain_matches: >-
          {{ (proxmox_domains.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_domain) | list }}

    - name: Create the Proxmox test domain
      ansible.builtin.command:
        argv:
          - hammer
          - domain
          - create
          - --name
          - "{{ proxmox_test_domain }}"
          - --organizations
          - "{{ proxmox_test_organization }}"
          - --locations
          - "{{ proxmox_test_location }}"
      when: proxmox_domain_matches | length == 0
      changed_when: true

    - name: Refresh the Proxmox test domain
      ansible.builtin.command:
        argv: [hammer, --output, json, domain, list, --per-page, '9999']
      register: proxmox_domains
      changed_when: false

    - name: Record the Proxmox test domain ID
      ansible.builtin.set_fact:
        proxmox_test_domain_id: >-
          {{ ((proxmox_domains.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_domain) | list | first).Id }}

    - name: Query existing Proxmox test subnet
      ansible.builtin.command:
        argv: [hammer, --output, json, subnet, list, --per-page, '9999']
      register: proxmox_subnets
      changed_when: false

    - name: Select the Proxmox test subnet
      ansible.builtin.set_fact:
        proxmox_subnet_matches: >-
          {{ (proxmox_subnets.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_subnet_name) | list }}

    - name: Verify the Proxmox test subnet is absent or unique
      ansible.builtin.assert:
        that: proxmox_subnet_matches | length <= 1
        fail_msg: "More than one subnet is named {{ proxmox_test_subnet_name }}."

    - name: Create the Proxmox test subnet
      ansible.builtin.command:
        argv:
          - hammer
          - subnet
          - create
          - --name
          - "{{ proxmox_test_subnet_name }}"
          - --network
          - "{{ proxmox_test_subnet_network }}"
          - --mask
          - "{{ proxmox_test_subnet_mask }}"
          - --gateway
          - "{{ proxmox_test_subnet_gateway }}"
          - --dns-primary
          - "{{ proxmox_test_subnet_dns }}"
          - --ipam
          - None
          - --boot-mode
          - Static
          - --dhcp
          - "{{ proxmox_test_dhcp_proxy }}"
          - --organization
          - "{{ proxmox_test_organization }}"
          - --location
          - "{{ proxmox_test_location }}"
      when: proxmox_subnet_matches | length == 0
      changed_when: true

    - name: Refresh the Proxmox test subnet
      ansible.builtin.command:
        argv: [hammer, --output, json, subnet, list, --per-page, '9999']
      register: proxmox_subnets
      changed_when: false

    - name: Record the Proxmox test subnet ID
      ansible.builtin.set_fact:
        proxmox_test_subnet_id: >-
          {{ ((proxmox_subnets.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_subnet_name) | list | first).Id }}

    - name: Assign the installer-managed DHCP Smart Proxy to the Proxmox test subnet
      ansible.builtin.command:
        argv:
          - hammer
          - subnet
          - update
          - --id
          - "{{ proxmox_test_subnet_id }}"
          - --dhcp
          - "{{ proxmox_test_dhcp_proxy }}"
      changed_when: false

    - name: Query existing provisioning templates
      ansible.builtin.command:
        argv: [hammer, --output, json, template, list, --per-page, '9999']
      register: proxmox_templates
      changed_when: false

    - name: Select the Proxmox provision template
      ansible.builtin.set_fact:
        proxmox_answer_template_matches: >-
          {{ (proxmox_templates.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_answer_template_name) | list }}

    - name: Select the Proxmox iPXE template
      ansible.builtin.set_fact:
        proxmox_ipxe_template_matches: >-
          {{ (proxmox_templates.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_ipxe_template_name) | list }}

    - name: Refuse conflicting template names
      ansible.builtin.assert:
        that:
          - proxmox_answer_template_matches | length <= 1
          - proxmox_ipxe_template_matches | length <= 1
        fail_msg: >-
          A Proxmox template name is ambiguous. Resolve it before running the test setup,
          because the supplied Bash deployer requires one exact name-and-kind match.

    - name: Stage a placeholder Provision template
      ansible.builtin.copy:
        dest: /var/tmp/proxmox-acceptance-provision.erb
        mode: '0600'
        content: |
          <%#
          kind: Provision
          name: Proxmox Autoinstall Answer File
          -%>
          [global]
          fqdn = "placeholder.invalid"
      when: proxmox_answer_template_matches | length == 0

    - name: Create the placeholder Provision template
      ansible.builtin.command:
        argv:
          - hammer
          - template
          - create
          - --name
          - "{{ proxmox_answer_template_name }}"
          - --type
          - provision
          - --file
          - /var/tmp/proxmox-acceptance-provision.erb
          - --organization
          - "{{ proxmox_test_organization }}"
          - --location
          - "{{ proxmox_test_location }}"
      when: proxmox_answer_template_matches | length == 0
      changed_when: true

    - name: Stage a placeholder iPXE template
      ansible.builtin.copy:
        dest: /var/tmp/proxmox-acceptance-ipxe.erb
        mode: '0600'
        content: |
          <%#
          kind: PXEiPXE
          name: Proxmox VE PXEiPXE
          -%>
          #!ipxe
          exit
      when: proxmox_ipxe_template_matches | length == 0

    - name: Create the placeholder iPXE template
      ansible.builtin.command:
        argv:
          - hammer
          - template
          - create
          - --name
          - "{{ proxmox_ipxe_template_name }}"
          - --type
          - iPXE
          - --file
          - /var/tmp/proxmox-acceptance-ipxe.erb
          - --organization
          - "{{ proxmox_test_organization }}"
          - --location
          - "{{ proxmox_test_location }}"
      when: proxmox_ipxe_template_matches | length == 0
      changed_when: true

    - name: Query existing Proxmox test operating system
      ansible.builtin.command:
        argv: [hammer, --output, json, os, list, --per-page, '9999']
      register: proxmox_operating_systems
      changed_when: false

    - name: Select the Proxmox test operating system
      ansible.builtin.set_fact:
        proxmox_os_matches: >-
          {{ (proxmox_operating_systems.stdout | from_json)
             | selectattr('Title', 'equalto', proxmox_test_os_name ~ ' ' ~ proxmox_test_os_major) | list }}

    - name: Verify the Proxmox test operating system is absent or unique
      ansible.builtin.assert:
        that: proxmox_os_matches | length <= 1
        fail_msg: "More than one operating system matches {{ proxmox_test_os_name }} {{ proxmox_test_os_major }}."

    - name: Create the Proxmox test operating system
      ansible.builtin.command:
        argv:
          - hammer
          - os
          - create
          - --name
          - "{{ proxmox_test_os_name }}"
          - --major
          - "{{ proxmox_test_os_major }}"
          - --release-name
          - "{{ proxmox_test_os_release_name }}"
          - --family
          - Debian
          - --architectures
          - x86_64
          - --provisioning-templates
          - "{{ proxmox_answer_template_name }},{{ proxmox_ipxe_template_name }}"
          - --organization
          - "{{ proxmox_test_organization }}"
          - --location
          - "{{ proxmox_test_location }}"
      when: proxmox_os_matches | length == 0
      changed_when: true

    - name: Refresh the Proxmox test operating system
      ansible.builtin.command:
        argv: [hammer, --output, json, os, list, --per-page, '9999']
      register: proxmox_operating_systems
      changed_when: false

    - name: Record the Proxmox test operating system ID
      ansible.builtin.set_fact:
        proxmox_test_os_id: >-
          {{ ((proxmox_operating_systems.stdout | from_json)
             | selectattr('Title', 'equalto', proxmox_test_os_name ~ ' ' ~ proxmox_test_os_major)
             | list | first).Id }}

    - name: Associate the test operating system with its build requirements
      ansible.builtin.command:
        argv:
          - hammer
          - os
          - update
          - --id
          - "{{ proxmox_test_os_id }}"
          - --media
          - "{{ proxmox_test_medium_name }}"
          - --partition-tables
          - "{{ proxmox_test_partition_table_name }}"
          - --provisioning-templates
          - "{{ proxmox_answer_template_name }},{{ proxmox_ipxe_template_name }}"
      changed_when: false

    - name: Query existing Proxmox test host group
      ansible.builtin.command:
        argv: [hammer, --output, json, hostgroup, list, --per-page, '9999']
      register: proxmox_hostgroups
      changed_when: false

    - name: Select the Proxmox test host group
      ansible.builtin.set_fact:
        proxmox_hostgroup_matches: >-
          {{ (proxmox_hostgroups.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_hostgroup_name) | list }}

    - name: Verify the Proxmox test host group is absent or unique
      ansible.builtin.assert:
        that: proxmox_hostgroup_matches | length <= 1
        fail_msg: "More than one host group is named {{ proxmox_test_hostgroup_name }}."

    - name: Create the Proxmox test host group
      ansible.builtin.command:
        argv:
          - hammer
          - hostgroup
          - create
          - --name
          - "{{ proxmox_test_hostgroup_name }}"
          - --operatingsystem-id
          - "{{ proxmox_test_os_id }}"
          - --subnet-id
          - "{{ proxmox_test_subnet_id }}"
          - --pxe-loader
          - iPXE Chain UEFI
          - --organization
          - "{{ proxmox_test_organization }}"
          - --location
          - "{{ proxmox_test_location }}"
      when: proxmox_hostgroup_matches | length == 0
      changed_when: true

    - name: Refresh the Proxmox test host group
      ansible.builtin.command:
        argv: [hammer, --output, json, hostgroup, list, --per-page, '9999']
      register: proxmox_hostgroups
      changed_when: false

    - name: Record the Proxmox test host group ID
      ansible.builtin.set_fact:
        proxmox_test_hostgroup_id: >-
          {{ ((proxmox_hostgroups.stdout | from_json)
             | selectattr('Name', 'equalto', proxmox_test_hostgroup_name) | list | first).Id }}

    - name: Set the host-group build defaults required for unattended provisioning
      ansible.builtin.command:
        argv:
          - hammer
          - hostgroup
          - update
          - --id
          - "{{ proxmox_test_hostgroup_id }}"
          - --medium
          - "{{ proxmox_test_medium_name }}"
          - --partition-table
          - "{{ proxmox_test_partition_table_name }}"
          - --root-password
          - "{{ proxmox_test_root_password }}"
      changed_when: false

    - name: Query the Proxmox provision-template combinations
      ansible.builtin.command:
        argv:
          - hammer
          - --output
          - json
          - template
          - combination
          - list
          - --provisioning-template
          - "{{ proxmox_answer_template_name }}"
      register: proxmox_template_combinations
      changed_when: false

    - name: Select the Proxmox host-group template combination
      ansible.builtin.set_fact:
        proxmox_template_combination_matches: >-
          {{ (proxmox_template_combinations.stdout | from_json)
             | selectattr('Hostgroup.Id', 'equalto', proxmox_test_hostgroup_id | int) | list }}

    - name: Verify the Proxmox host-group template combination is absent or unique
      ansible.builtin.assert:
        that: proxmox_template_combination_matches | length <= 1
        fail_msg: >-
          More than one provision-template combination exists for
          {{ proxmox_test_hostgroup_name }}.

    - name: Create the Proxmox host-group template combination
      ansible.builtin.command:
        argv:
          - hammer
          - template
          - combination
          - create
          - --provisioning-template
          - "{{ proxmox_answer_template_name }}"
          - --hostgroup
          - "{{ proxmox_test_hostgroup_name }}"
      when: proxmox_template_combination_matches | length == 0
      changed_when: true

    - name: Regenerate the local acceptance payload from its test fixture
      ansible.builtin.copy:
        src: "{{ proxmox_acceptance_fixture_example }}"
        dest: "{{ proxmox_acceptance_fixture }}"
        force: true
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Populate the local acceptance payload with test-object IDs
      ansible.builtin.replace:
        path: "{{ proxmox_acceptance_fixture }}"
        regexp: '"{{ item.key }}": "(?:REPLACE_WITH_[A-Z_]+|[0-9]+)"'
        replace: '"{{ item.key }}": "{{ item.value }}"'
      loop:
        - key: organization_id
          value: "{{ (proxmox_organization_matches | first).Id }}"
        - key: location_id
          value: "{{ (proxmox_location_matches | first).Id }}"
        - key: hostgroup_id
          value: "{{ proxmox_test_hostgroup_id }}"
        - key: subnet_id
          value: "{{ proxmox_test_subnet_id }}"
        - key: architecture_id
          value: "{{ proxmox_test_architecture_id }}"
        - key: domain_id
          value: "{{ proxmox_test_domain_id }}"
        - key: ip
          value: "{{ proxmox_test_acceptance_ip }}"
      delegate_to: localhost
      become: false

    - name: Report the created test-object IDs
      ansible.builtin.debug:
        msg:
          organization_id: "{{ (proxmox_organization_matches | first).Id }}"
          location_id: "{{ (proxmox_location_matches | first).Id }}"
          hostgroup_id: "{{ proxmox_test_hostgroup_id }}"
          subnet_id: "{{ proxmox_test_subnet_id }}"
