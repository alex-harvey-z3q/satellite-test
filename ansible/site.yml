---
- name: Install Red Hat Satellite on the EC2 host
  hosts: satellite
  become: true
  gather_facts: true
  vars:
    satellite_log: /var/log/satellite-installer-poc.log
    satellite_disable_selinux_for_proxmox_poc: true

  pre_tasks:
    - name: Verify a supported RHEL 9 x86_64 host
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'RedHat'
          - ansible_facts['distribution_major_version'] == '9'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: Satellite {{ satellite_version }} requires a fresh RHEL 9 x86_64 host.

    - name: Verify the Satellite FQDN resolves locally
      ansible.builtin.command: getent hosts {{ satellite_fqdn }}
      changed_when: false

    - name: Persist SELinux disabled for the Proxmox POC
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=disabled
      when: satellite_disable_selinux_for_proxmox_poc | bool

    - name: Inspect the current SELinux enforcement mode
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false
      when: satellite_disable_selinux_for_proxmox_poc | bool

    - name: Set SELinux permissive until the next reboot
      ansible.builtin.command: setenforce 0
      when:
        - satellite_disable_selinux_for_proxmox_poc | bool
        - selinux_mode.stdout == 'Enforcing'
      changed_when: true

    - name: Optionally remove the RHUI client from a Cloud Access Gold Image
      ansible.builtin.dnf:
        name: rh-amazon-rhui-client*
        state: absent
      when: remove_rhui_client | bool

    - name: Enable product-id plugin for a Cloud Access Gold Image
      ansible.builtin.copy:
        dest: /etc/yum/pluginconf.d/product-id.conf
        content: "[main]\\nenabled=1\\n"
        mode: '0644'
      when: remove_rhui_client | bool

    - name: Verify Red Hat credentials were supplied by the runner environment
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'RHSM_USERNAME') | length > 0
          - lookup('ansible.builtin.env', 'RHSM_PASSWORD') | length > 0
        fail_msg: Set RHSM_USERNAME and RHSM_PASSWORD before running scripts/install.sh.

    - name: Register with Red Hat Subscription Management
      ansible.builtin.shell: >-
        subscription-manager register --force
        --username "$RHSM_USERNAME" --password "$RHSM_PASSWORD"
      args:
        executable: /bin/bash
      environment:
        RHSM_USERNAME: "{{ lookup('ansible.builtin.env', 'RHSM_USERNAME') }}"
        RHSM_PASSWORD: "{{ lookup('ansible.builtin.env', 'RHSM_PASSWORD') }}"
      no_log: true
      changed_when: true

    - name: Allow Subscription Manager to manage Red Hat repositories
      ansible.builtin.command:
        argv:
          - subscription-manager
          - config
          - --rhsm.manage_repos=1
      changed_when: true

    - name: Attach the eligible Red Hat trial subscription
      ansible.builtin.command:
        argv:
          - subscription-manager
          - attach
          - --auto
      register: subscription_attach
      changed_when: "'Successfully attached' in subscription_attach.stdout"
      failed_when: >-
        subscription_attach.rc != 0 and
        'already attached' not in subscription_attach.stdout | lower

    - name: Disable all repositories before enabling Satellite repositories
      ansible.builtin.command: subscription-manager repos --disable=*
      changed_when: true

    - name: Enable required RHEL and Satellite repositories
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - --enable=rhel-9-for-x86_64-baseos-rpms
          - --enable=rhel-9-for-x86_64-appstream-rpms
          - --enable=satellite-{{ satellite_version }}-for-rhel-9-x86_64-rpms
          - --enable=satellite-maintenance-{{ satellite_version }}-for-rhel-9-x86_64-rpms
      changed_when: true

    - name: Locate the Pulp EBS device by its AWS volume serial
      ansible.builtin.shell: |
        set -o pipefail
        lsblk -dn -o NAME,SERIAL | awk '$2 == "{{ pulp_volume_id | regex_replace("-", "") }}" { print "/dev/" $1; exit }'
      args:
        executable: /bin/bash
      register: pulp_device_lookup
      changed_when: false

    - name: Verify the Pulp EBS device is attached
      ansible.builtin.assert:
        that: pulp_device_lookup.stdout | length > 0
        fail_msg: "The EBS volume {{ pulp_volume_id }} is not visible yet. Wait for attachment and re-run."

    - name: Inspect Pulp EBS filesystem
      ansible.builtin.command: lsblk -dn -o FSTYPE {{ pulp_device_lookup.stdout }}
      register: pulp_filesystem
      changed_when: false

    - name: Create the XFS filesystem for Pulp content
      ansible.builtin.command: mkfs.xfs -f {{ pulp_device_lookup.stdout }}
      when: pulp_filesystem.stdout | trim == ''
      changed_when: true

    - name: Get Pulp EBS UUID
      ansible.builtin.command: blkid -s UUID -o value {{ pulp_device_lookup.stdout }}
      register: pulp_uuid
      changed_when: false

    - name: Create the Pulp mount point
      ansible.builtin.file:
        path: /var/lib/pulp
        state: directory
        mode: '0755'

    - name: Persist and mount the Pulp volume
      ansible.posix.mount:
        path: /var/lib/pulp
        src: UUID={{ pulp_uuid.stdout }}
        fstype: xfs
        opts: defaults,nofail
        state: mounted

  tasks:
    - name: Check whether Satellite is already installed
      ansible.builtin.command:
        argv: [rpm, --quiet, --query, satellite]
      register: satellite_package
      changed_when: false
      failed_when: false

    - name: Check Proxmox provisioning package prerequisites
      ansible.builtin.command:
        argv: [rpm, --quiet, --query, dhcp-server, ipxe-bootimgs-x86]
      register: proxmox_provisioning_packages
      changed_when: false
      failed_when: false

    - name: Install Proxmox provisioning prerequisites before Satellite package protection
      ansible.builtin.dnf:
        name:
          - dhcp-server
          - ipxe-bootimgs-x86
        state: present
      when:
        - satellite_package.rc != 0
        - proxmox_provisioning_packages.rc != 0

    - name: Install missing Proxmox prerequisites through Satellite maintenance
      ansible.builtin.command:
        argv: [foreman-maintain, packages, install, --assumeyes, dhcp-server, ipxe-bootimgs-x86]
      when:
        - satellite_package.rc == 0
        - proxmox_provisioning_packages.rc != 0
      changed_when: true

    - name: Install the Satellite installer package
      ansible.builtin.dnf:
        name: satellite
        state: present

    - name: Locate the dedicated provisioning interface
      ansible.builtin.shell: >-
        ip -o -4 addr show |
        awk '$4 ~ /^{{ satellite_provisioning_interface_ip | regex_escape }}\// { print $2; exit }'
      args:
        executable: /bin/bash
      register: satellite_provisioning_interface
      changed_when: false

    - name: Verify the dedicated provisioning interface is attached
      ansible.builtin.assert:
        that: satellite_provisioning_interface.stdout | length > 0
        fail_msg: >-
          Terraform's provisioning ENI ({{ satellite_provisioning_interface_ip }}) is not visible.
          Apply Terraform and wait for the ENI attachment before running make install.

    - name: Run the Satellite installer once
      ansible.builtin.shell: >-
        satellite-installer --scenario satellite
        --foreman-initial-organization "{{ satellite_initial_organization | default('Default Organization') }}"
        --foreman-initial-location "{{ satellite_initial_location | default('Default Location') }}"
        --foreman-initial-admin-password {{ satellite_initial_admin_password | quote }}
        --foreman-proxy-tftp true
        --foreman-proxy-dhcp true
        --foreman-proxy-dhcp-listen-on both
        --foreman-proxy-dhcp-interface "{{ satellite_provisioning_interface.stdout }}"
        --foreman-proxy-dhcp-network "{{ satellite_provisioning_subnet_network }}"
        --foreman-proxy-dhcp-netmask "{{ satellite_provisioning_subnet_mask }}"
        --foreman-proxy-dhcp-gateway "{{ satellite_provisioning_subnet_gateway }}"
        --foreman-proxy-dhcp-range "{{ satellite_provisioning_dhcp_range_start }} {{ satellite_provisioning_dhcp_range_end }}"
        --foreman-proxy-dhcp-subnets "{{ satellite_provisioning_subnet_cidr }}"
        |& tee {{ satellite_log }}
      args:
        executable: /bin/bash
      no_log: true

    - name: Stage the UEFI iPXE image for the supplied Proxmox DHCP deployer
      ansible.builtin.copy:
        src: /usr/share/ipxe/ipxe-x86_64.efi
        dest: /var/lib/tftpboot/ipxe.efi
        remote_src: true
        owner: root
        group: root
        mode: '0644'
